name: ft_lgtm

networks:
  lgtm-net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - lgtm-net
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - OTEL_SERVICE_NAME=backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
      - IPFS_API_URL=http://ipfs:5001
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3100/loki/api/v1/push
        mode: non-blocking

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        PUBLIC_API_URL: http://localhost:3000/api/v1
        PUBLIC_IPFS_URL: http://localhost:8080/ipfs/
    restart: unless-stopped
    networks:
      - lgtm-net
    ports:
      - "5173:5173"
    environment:
      - PUBLIC_API_URL=http://localhost:3000/api/v1
      - PUBLIC_IPFS_URL=http://localhost:8080/ipfs/
    volumes:
      - ./frontend:/app
      - /app/node_modules

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    networks:
      - lgtm-net
    ports:
      - "3001:3000"
    expose:
      - "3100"
      - "3200"
      - "4040"
      - "4317"
      - "4318"
      - "9090"

  ipfs:
    image: ipfs/kubo:latest
    restart: unless-stopped
    networks:
      - lgtm-net
    ports:
      - "4001:4001" # P2P TCP
      - "4001:4001/udp" # QUIC
      - "8080:8080" # Web UI
    expose:
      - "5001" # RPC API
    volumes:
      - ./ipfs-staging:/export
      - ./ipfs-data:/data/ipfs
